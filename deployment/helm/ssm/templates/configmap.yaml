apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ssm.fullname" . }}-mongodb-connection
  labels:
    {{- include "ssm.labels" . | nindent 4 }}
data:
  MONGO_APP: {{ include "ssm.fullname" . }}
  MONGO_PORT: {{ .Values.ports.mongodb | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ssm.fullname" . }}-s3-connection
  labels:
    {{- include "ssm.labels" . | nindent 4 }}
data:
  BUCKET_NAME: {{ .Values.s3.bucketName | quote }}
  S3_URL: {{ .Values.s3.url | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ssm.fullname" . }}-auth
  labels:
    {{- include "ssm.labels" . | nindent 4 }}
data:
  AUTH_REDIRECT_URI: {{ printf "https://%s%s" .Values.ingress.host .Values.auth.redirectPath | quote }}
  AUTH_CLIENT_ID: {{ .Values.auth.clientId | quote }}
  AUTH_PROVIDER_LABEL: {{ .Values.auth.providerLabel | quote }}
  {{- if .Values.auth.disabled }}
  AUTH_DISABLED: "true"
  {{- else }}
  AUTH_ISSUER: {{ required "auth.issuer is required unless auth.disabled is true" .Values.auth.issuer | quote }}
  {{- end }}
