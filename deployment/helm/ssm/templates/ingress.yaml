apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ssm.fullname" . }}-ingress
  labels:
    {{- include "ssm.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: k8s-tls-issuer
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.ingress.proxyBodySize | quote }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ssm.fullname" . }}
                port:
                  name: frontend
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecretName }}
