{{- if .Values.cleanupS3.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "ssm.fullname" . }}-cleanup-s3
  labels:
    {{- include "ssm.labels" . | nindent 4 }}
    app.kubernetes.io/component: cron-cleanup-s3
spec:
  schedule: {{ .Values.cleanupS3.schedule | quote }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "ssm.selectorLabels" . | nindent 12 }}
        spec:
          containers:
            - name: cron-cleanup-s3
              image: amazon/aws-cli:latest
              command: [ "/bin/sh", "-c" ]
              envFrom:
                - configMapRef:
                    name: {{ include "ssm.fullname" . }}-s3-connection
                - secretRef:
                    name: {{ .Values.secrets.s3 }}
              args:
                - >
                  echo -e "Clearing UAT S3 data...\n"

                  export AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY"

                  export AWS_SECRET_ACCESS_KEY="$S3_SECRET_KEY"

                  export AWS_DEFAULT_REGION="us-east-1"

                  aws --endpoint-url "$S3_URL" s3 rm "s3://$BUCKET_NAME" --recursive || true

                  echo -e "\nS3 cleanup completed.\n"
          restartPolicy: OnFailure
{{- end }}
