# Generic defaults. Organisation/environment-specific values (image registry,
# hostnames, storage, NFS backup target, identity provider, ...) belong in your
# own values overlays, kept outside this repo and passed with `-f`. Values
# marked REQUIRED have placeholder defaults that must be overridden.

nameOverride: ""
fullnameOverride: "spreadsheet-schema-manager"

image:
  # REQUIRED: the registry/repository your CI pushes the app image to.
  repository: registry.example.com/spreadsheet-schema-manager/spreadsheet-schema-manager-rio
  tag: latest
  pullPolicy: Always

replicas: 1

ports:
  app: 8000
  mongodb: 27017
  seaweedfs: 8333

mongodb:
  image:
    repository: mongo
    tag: 8.3.4-noble
  storage: 100M
  storageClassName: "" # empty = cluster default StorageClass

ingress:
  # REQUIRED: public hostname of the app.
  host: spreadsheet-schema-manager.example.com
  className: nginx
  # cert-manager ClusterIssuer used to provision the TLS cert. Leave empty to
  # manage the TLS secret yourself.
  clusterIssuer: ""
  tlsSecretName: ssm-tls-secret
  proxyBodySize: 200M

auth:
  redirectPath: /login
  disabled: false
  # REQUIRED unless disabled: Keycloak realm URL, e.g.
  # https://keycloak.example.com/realms/<realm>
  issuer: ""
  clientId: spreadsheet-schema
  # Shown on the login button: "Log in via <providerLabel> SSO".
  providerLabel: Keycloak

s3:
  url: http://spreadsheet-schema-manager:8333
  bucketName: spreadsheet-schema

# In-pod SeaweedFS S3 gateway.
seaweedfs:
  enabled: true
  image:
    repository: chrislusf/seaweedfs
    tag: "4.44"
  storage: 100M
  storageClassName: "" # empty = cluster default StorageClass

# Secrets are managed outside this chart (ArgoCD / manually created).
# Only their names are referenced here.
secrets:
  db: db-secret
  s3: s3-secret
  auth: auth-secret
  extra: [] # e.g. ["test-secret"] for uat

resources: {}

# The backup/restore jobs below read and write archives on an NFS share.
# nfs.server and nfs.path are REQUIRED when the job is enabled.

backup:
  enabled: false
  schedule: "30 2 * * *"
  nfs:
    server: ""
    path: ""

restore:
  enabled: false
  suspend: true
  schedule: "0 3 * * *"
  nfs:
    server: ""
    path: ""

cleanup:
  enabled: false
  schedule: "0 3 * * *"

cleanupS3:
  enabled: false
  schedule: "0 3 * * *"

# Manually-triggered only (suspend: true always) — mirrors the seaweedfs
# bucket to the same NFS path used for the mongodb backups.
backupS3:
  enabled: false
  suspend: true
  schedule: "45 2 * * *"
  nfs:
    server: ""
    path: ""

# Manually-triggered only (suspend: true always) — restores the latest
# backupS3 archive back into the seaweedfs bucket.
restoreS3:
  enabled: false
  suspend: true
  schedule: "15 3 * * *"
  nfs:
    server: ""
    path: ""
