apiVersion: v1
kind: Service
metadata:
  name: {{ include "ssm.fullname" . }}
  labels:
    {{- include "ssm.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ssm.selectorLabels" . | nindent 4 }}
  ports:
    - name: mongodb
      protocol: TCP
      port: {{ .Values.ports.mongodb }}
      targetPort: {{ .Values.ports.mongodb }}
    - name: frontend
      protocol: TCP
      port: {{ .Values.ports.app }}
      targetPort: {{ .Values.ports.app }}
{{- if .Values.seaweedfs.enabled }}
    - name: seaweedfs-s3
      protocol: TCP
      port: {{ .Values.ports.seaweedfs }}
      targetPort: {{ .Values.ports.seaweedfs }}
{{- end }}
